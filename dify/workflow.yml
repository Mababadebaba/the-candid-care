app:
  name: "The Candid Care - Content Pipeline"
  description: "RSS → AI Rewrite → SEO Metadata → Sanity Publish"
  icon: "📝"
  icon_type: emoji
  icon_background: "#A16207"
  mode: workflow
  use_icon_as_answer_icon: false
kind: app
version: "0.6.0"
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.1@deepseek
      version: null
workflow:
  conversation_variables: []
  environment_variables:
    - description: "RSS feed URLs, one per line"
      id: env-rss-urls
      name: RSS_FEED_URLS
      selector: [env, RSS_FEED_URLS]
      value: "https://www.health.harvard.edu/blog/feed\nhttps://www.sleepfoundation.org/feed\nhttps://www.mindful.org/feed\nhttps://www.psychologytoday.com/us/blog/feed"
      value_type: string
    - description: "Sanity project ID"
      id: env-sanity-project
      name: SANITY_PROJECT_ID
      selector: [env, SANITY_PROJECT_ID]
      value: "o06jwzs8"
      value_type: string
    - description: "Sanity dataset name"
      id: env-sanity-dataset
      name: SANITY_DATASET
      selector: [env, SANITY_DATASET]
      value: "production"
      value_type: string
    - description: "Sanity API token (Editor permission)"
      id: env-sanity-token
      name: SANITY_API_TOKEN
      selector: [env, SANITY_API_TOKEN]
      value: ""
      value_type: string
    - description: "Default author Sanity _id"
      id: env-author-id
      name: AUTHOR_REF_ID
      selector: [env, AUTHOR_REF_ID]
      value: "author-default"
      value_type: string
    - description: "Public site URL"
      id: env-site-url
      name: SITE_PUBLIC_URL
      selector: [env, SITE_PUBLIC_URL]
      value: "https://the-candid-care.vercel.app"
      value_type: string
  features:
    file_upload:
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods: [local_file, remote_url]
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: [local_file, remote_url]
      number_limits: 3
    opening_statement: ""
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ""
      voice: ""
  graph:
    nodes:
      - data:
          title: "Start"
          type: start
          selected: false
          variables: []
        id: "start-1"
        position:
          x: 30
          y: 300
        positionAbsolute:
          x: 30
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 243
        height: 89
      - data:
          title: "RSS Fetch"
          type: code
          selected: false
          code_language: python3
          code: |
            import feedparser
            import hashlib
            import os

            def main() -> dict:
                urls = [u.strip() for u in os.environ.get("RSS_FEED_URLS", "{{#env.RSS_FEED_URLS#}}").split("\n") if u.strip()]
                articles = []
                seen = set()

                for url in urls:
                    try:
                        feed = feedparser.parse(url)
                        for entry in feed.entries[:5]:
                            link = entry.get("link", "")
                            h = hashlib.md5(link.encode()).hexdigest()
                            if h in seen:
                                continue
                            seen.add(h)
                            articles.append({
                                "title": entry.get("title", ""),
                                "link": link,
                                "summary": entry.get("summary", "")[:500],
                                "source": feed.feed.get("title", url),
                                "published": entry.get("published", "")
                            })
                    except Exception:
                        continue

                return {
                    "articles": articles,
                    "count": len(articles),
                    "json": str(articles)
                }
          outputs:
            articles:
              type: array[object]
            count:
              type: number
            json:
              type: string
          selected: false
        id: "rss-fetch"
        position:
          x: 320
          y: 300
        positionAbsolute:
          x: 320
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 243
        height: 89
      - data:
          title: "AI Rewrite"
          type: llm
          selected: false
          model:
            provider: langgenius/deepseek/deepseek
            name: deepseek-chat
            mode: chat
            completion_params:
              temperature: 0.7
          prompt_template:
            - id: rewrite-sys
              role: system
              text: |
                You are a senior wellness editor for "The Candid Care" — a premium health & wellness publication.

                BRAND VOICE:
                - Warm, compassionate, evidence-based
                - Accessible yet authoritative (8th-grade reading level)
                - Empowering without being preachy
                - Use "you" to connect with the reader

                ARTICLE STRUCTURE (5 sections):
                1. Hook — Start with a relatable insight or question
                2. Why It Matters — The science/context in plain language
                3. The How-To — 3-4 actionable, specific strategies
                4. Common Pitfalls — What to avoid
                5. The Bottom Line — A warm, encouraging takeaway (2-3 sentences)

                FORMAT RULES:
                - Title: 40-60 chars, compelling, include target keyword
                - Word count: 600-900 words
                - Use markdown headings (##) for each section
                - No markdown in the title line
                - First line = title, rest = body
            - id: rewrite-user
              role: user
              text: |
                Rewrite this article in The Candid Care style:

                Original title: {{#rss-fetch.articles#[0].title#}}
                Original source: {{#rss-fetch.articles#[0].link#}}

                Content:
                {{#rss-fetch.articles#[0].summary#}}

                Output format:
                Line 1: The new title only
                Then a blank line
                Then the article body with ## section headings
          context:
            enabled: false
            variable_selector: []
          memory:
            query_prompt_template: ""
            role_prefix:
              assistant: ""
              user: ""
            window:
              enabled: false
              size: 50
          vision:
            enabled: false
          selected: false
        id: "rewrite"
        position:
          x: 610
          y: 300
        positionAbsolute:
          x: 610
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 243
        height: 89
      - data:
          title: "SEO Metadata"
          type: llm
          selected: false
          model:
            provider: langgenius/deepseek/deepseek
            name: deepseek-chat
            mode: chat
            completion_params:
              temperature: 0.3
          prompt_template:
            - id: seo-sys
              role: system
              text: |
                You are an SEO/GEO metadata generator for "The Candid Care" wellness website.
                Generate structured metadata for the rewritten article.
                Output ONLY valid JSON — no markdown, no explanation.
            - id: seo-user
              role: user
              text: |
                Article:
                {{#rewrite.text#}}

                Generate this JSON:
                {
                  "seo_title": "SEO title (55-65 chars, include primary keyword)",
                  "seo_description": "Meta description (140-160 chars, compelling CTA)",
                  "category": "one of: mindfulness, nutrition, movement, sleep, mental-health, relationships, self-care",
                  "tags": ["tag1", "tag2", "tag3"],
                  "excerpt": "Article excerpt (100-150 chars)",
                  "key_takeaways": ["takeaway 1", "takeaway 2", "takeaway 3"],
                  "faqs": [
                    {"question": "...", "answer": "..."},
                    {"question": "...", "answer": "..."},
                    {"question": "...", "answer": "..."}
                  ]
                }
          context:
            enabled: false
            variable_selector: []
          memory:
            query_prompt_template: ""
            role_prefix:
              assistant: ""
              user: ""
            window:
              enabled: false
              size: 50
          vision:
            enabled: false
          selected: false
        id: "seo-meta"
        position:
          x: 900
          y: 300
        positionAbsolute:
          x: 900
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 243
        height: 89
      - data:
          title: "Publish to Sanity"
          type: code
          selected: false
          code_language: python3
          code: |
            import json
            import urllib.request
            import urllib.parse

            def main(article_text: str, seo_json: str) -> dict:
                proj_id = "{{#env.SANITY_PROJECT_ID#}}"
                dataset = "{{#env.SANITY_DATASET#}}"
                token = "{{#env.SANITY_API_TOKEN#}}"
                author_id = "{{#env.AUTHOR_REF_ID#}}"
                site_url = "{{#env.SITE_PUBLIC_URL#}}"

                # Parse inputs
                lines = article_text.strip().split("\n")
                title = lines[0].strip("# ").strip()
                body = "\n".join(lines[1:]).strip()

                try:
                    meta = json.loads(seo_json)
                except:
                    meta = {
                        "seo_title": title,
                        "seo_description": title,
                        "category": "self-care",
                        "tags": ["wellness"],
                        "excerpt": body[:150],
                        "key_takeaways": ["Practice daily."],
                        "faqs": [{"question": "What is this about?", "answer": body[:100]}]
                    }

                # Generate placeholder image SVG (warm gradient)
                svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
                  <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#1C1A17"/>
                  <stop offset="50%" style="stop-color:#A16207"/>
                  <stop offset="100%" style="stop-color:#FAFAF8"/>
                  </linearGradient></defs>
                  <rect width="1200" height="630" fill="url(#g)"/>
                  <text x="600" y="315" text-anchor="middle" fill="white" font-size="42" font-family="Georgia,serif">{title[:80]}</text>
                  </svg>'''

                # Upload image
                img_url = f"https://{proj_id}.api.sanity.io/v2023-08-01/assets/images/{dataset}"
                img_req = urllib.request.Request(img_url, data=svg.encode(), method="POST")
                img_req.add_header("Authorization", f"Bearer {token}")
                img_req.add_header("Content-Type", "image/svg+xml")
                try:
                    img_resp = json.loads(urllib.request.urlopen(img_req).read())
                    image_ref = {"_type": "image", "asset": {"_type": "reference", "_ref": img_resp["document"]["_id"]}}
                except:
                    image_ref = None

                # Build portable text from markdown
                blocks = []
                for line in body.split("\n"):
                    line = line.strip()
                    if not line:
                        continue
                    if line.startswith("## "):
                        blocks.append({
                            "_type": "block",
                            "style": "h2",
                            "children": [{"_type": "span", "text": line[3:].strip(), "marks": []}]
                        })
                    elif line.startswith("# "):
                        blocks.append({
                            "_type": "block",
                            "style": "h2",
                            "children": [{"_type": "span", "text": line[2:].strip(), "marks": []}]
                        })
                    else:
                        blocks.append({
                            "_type": "block",
                            "style": "normal",
                            "children": [{"_type": "span", "text": line, "marks": []}]
                        })

                # Slug
                slug = title.lower().replace(" ", "-").replace("'", "").replace(":", "")[:80]

                # Get category ref
                cat_slug = meta.get("category", "self-care")
                cat_ref = {"_type": "reference", "_ref": f"cat-{cat_slug}"}

                # Create document
                doc = {
                    "_type": "article",
                    "title": meta.get("seo_title", title),
                    "slug": {"_type": "slug", "current": slug},
                    "excerpt": meta.get("excerpt", body[:150]),
                    "body": blocks,
                    "category": cat_ref,
                    "author": {"_type": "reference", "_ref": author_id},
                    "publishedAt": None,
                    "tags": meta.get("tags", ["wellness"]),
                    "keyTakeaways": meta.get("key_takeaways", []),
                    "faqs": meta.get("faqs", []),
                    "seoMeta": {
                        "metaTitle": meta.get("seo_title", title),
                        "metaDescription": meta.get("seo_description", "")
                    }
                }

                if image_ref:
                    doc["mainImage"] = image_ref

                # Publish to Sanity
                mutate_url = f"https://{proj_id}.api.sanity.io/v2023-08-01/data/mutate/{dataset}"
                payload = json.dumps({"mutations": [{"create": doc}]}).encode()
                req = urllib.request.Request(mutate_url, data=payload, method="POST")
                req.add_header("Authorization", f"Bearer {token}")
                req.add_header("Content-Type", "application/json")
                resp = json.loads(urllib.request.urlopen(req).read())

                return {
                    "status": "published",
                    "title": title,
                    "slug": slug,
                    "url": f"{site_url}/{cat_slug}/{slug}"
                }
          variables:
            - value_selector: ["rewrite", "text"]
              variable: article_text
            - value_selector: ["seo-meta", "text"]
              variable: seo_json
          outputs:
            status:
              type: string
            title:
              type: string
            slug:
              type: string
            url:
              type: string
          selected: false
        id: "sanity-publish"
        position:
          x: 1190
          y: 300
        positionAbsolute:
          x: 1190
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 243
        height: 89
      - data:
          title: "End"
          type: end
          selected: false
          outputs:
            - variable: result
              value_selector: ["sanity-publish", "url"]
        id: "end-1"
        position:
          x: 1500
          y: 300
        positionAbsolute:
          x: 1500
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 243
        height: 89
    edges:
      - data:
          isInLoop: false
          isInIteration: false
          sourceType: start
          targetType: code
        id: start-1-source-rss-fetch-target
        selected: false
        source: "start-1"
        sourceHandle: source
        target: "rss-fetch"
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInLoop: false
          isInIteration: false
          sourceType: code
          targetType: llm
        id: rss-fetch-source-rewrite-target
        selected: false
        source: "rss-fetch"
        sourceHandle: source
        target: "rewrite"
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInLoop: false
          isInIteration: false
          sourceType: llm
          targetType: llm
        id: rewrite-source-seo-meta-target
        selected: false
        source: "rewrite"
        sourceHandle: source
        target: "seo-meta"
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInLoop: false
          isInIteration: false
          sourceType: llm
          targetType: code
        id: seo-meta-source-sanity-publish-target
        selected: false
        source: "seo-meta"
        sourceHandle: source
        target: "sanity-publish"
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInLoop: false
          isInIteration: false
          sourceType: code
          targetType: end
        id: sanity-publish-source-end-1-target
        selected: false
        source: "sanity-publish"
        sourceHandle: source
        target: "end-1"
        targetHandle: target
        type: custom
        zIndex: 0
    viewport:
      x: 0
      y: 0
      zoom: 0.8
