app:
  description: >
    自动化内容管道：定时从 RSS 源采集健康与生活方式文章，
    DeepSeek AI 审核并改写为 The Candid Care 品牌风格，
    自动发布到 Sanity CMS 并触发站点重建。
  icon: "\U0001F916"
  icon_background: "#1C1A17"
  mode: advanced-chat
  name: "The Candid Care \u2014 Content Pipeline"
  use_icon_as_answer_icon: false
kind: app
version: 0.1.2
workflow:
  conversation_variables: []
  environment_variables:
    - key: RSS_FEED_URLS
      name: RSS源地址列表
      type: string
      description: 换行分隔的 RSS 源 URL
      value: |
        https://www.health.harvard.edu/blog/feed
        https://www.sleepfoundation.org/feed
        https://www.psychologytoday.com/us/blog/feed
        https://www.nutritionfacts.org/feed
    - key: SANITY_PROJECT_ID
      name: Sanity 项目 ID
      type: string
      description: 从 Sanity Dashboard 获取
      value: "o06jwzs8"
    - key: SANITY_DATASET
      name: Sanity 数据集
      type: string
      description: 通常为 production
      value: "production"
    - key: SANITY_API_TOKEN
      name: Sanity API Token
      type: secret
      description: Sanity Dashboard → API → Tokens → Editor 权限
      value: ""
    - key: AUTHOR_REF_ID
      name: 默认作者 ID
      type: string
      description: 自动创建的默认作者引用
      value: "author-default"
    - key: SITE_PUBLIC_URL
      name: 站点公开地址
      type: string
      description: 用于引用原文链接
      value: "https://the-candid-care.vercel.app"
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
        - local_file
        - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 500
        batch_count_limit: 50
        file_size_limit: 100
        image_file_size_limit: 100
        video_file_size_limit: 500
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
          - local_file
          - remote_url
      number_limits: 3
    opening_statement: ""
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ""
      voice: ""
  graph:
    edges:
      # start → rss-fetch
      - data:
          isInIteration: false
          sourceType: start
          targetType: code
        id: start-source-rss-target
        source: start
        sourceHandle: source
        target: rss-fetch
        targetHandle: target
        type: custom
        zIndex: 0
      # rss-fetch → article-review
      - data:
          isInIteration: false
          sourceType: code
          targetType: llm
        id: rss-source-review-target
        source: rss-fetch
        sourceHandle: source
        target: article-review
        targetHandle: target
        type: custom
        zIndex: 0
      # article-review → if-approved
      - data:
          isInIteration: false
          sourceType: llm
          targetType: if-else
        id: review-source-if-target
        source: article-review
        sourceHandle: source
        target: if-approved
        targetHandle: target
        type: custom
        zIndex: 0
      # if-approved (approved) → article-rewrite
      - data:
          isInIteration: false
          sourceType: if-else
          targetType: llm
        id: if-approved-true-rewrite-target
        source: if-approved
        sourceHandle: "true"
        target: article-rewrite
        targetHandle: target
        type: custom
        zIndex: 0
      # if-approved (rejected) → end
      - data:
          isInIteration: false
          sourceType: if-else
          targetType: answer
        id: if-approved-false-end-target
        source: if-approved
        sourceHandle: "false"
        target: end
        targetHandle: target
        type: custom
        zIndex: 0
      # article-rewrite → generate-metadata
      - data:
          isInIteration: false
          sourceType: llm
          targetType: llm
        id: rewrite-source-metadata-target
        source: article-rewrite
        sourceHandle: source
        target: generate-metadata
        targetHandle: target
        type: custom
        zIndex: 0
      # generate-metadata → sanity-publish
      - data:
          isInIteration: false
          sourceType: llm
          targetType: code
        id: metadata-source-sanity-target
        source: generate-metadata
        sourceHandle: source
        target: sanity-publish
        targetHandle: target
        type: custom
        zIndex: 0
      # sanity-publish → end
      - data:
          isInIteration: false
          sourceType: code
          targetType: answer
        id: sanity-source-end-target
        source: sanity-publish
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      # ── Node 1: Start ──
      - data:
          desc: "每 6 小时自动运行（需在应用设置中配置定时触发器）"
          selected: false
          title: 开始
          type: start
          variables: []
        height: 54
        id: start
        position:
          x: 80
          y: 282
        positionAbsolute:
          x: 80
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ── Node 2: RSS 采集 (Code) ──
      - data:
          code: |
            """
            从配置的 RSS 源抓取最近 24 小时的文章
            """
            import json
            import xml.etree.ElementTree as ET
            from datetime import datetime, timedelta, timezone
            from urllib.request import Request, urlopen
            import re

            feed_urls_str = """{{#env.RSS_FEED_URLS#}}"""
            feed_urls = [u.strip() for u in feed_urls_str.split("\n") if u.strip() and u.strip().startswith("http")]

            all_articles = []
            cutoff = datetime.now(timezone.utc) - timedelta(hours=24)

            for feed_url in feed_urls:
                try:
                    req = Request(feed_url, headers={"User-Agent": "TheCandidCare/1.0"})
                    with urlopen(req, timeout=15) as resp:
                        xml_data = resp.read().decode("utf-8")
                    root = ET.fromstring(xml_data)
                    for item in root.iter("item"):
                        title = item.findtext("title", "").strip()
                        link = item.findtext("link", "").strip()
                        description = item.findtext("description", "").strip()
                        pub_date_str = item.findtext("pubDate", "").strip()
                        if not title or not link:
                            continue
                        description = re.sub(r"<[^>]+>", "", description)[:500]
                        try:
                            from email.utils import parsedate_to_datetime
                            pub_date = parsedate_to_datetime(pub_date_str)
                        except:
                            pub_date = datetime.now(timezone.utc)
                        if pub_date >= cutoff:
                            all_articles.append({
                                "title": title,
                                "source_url": link,
                                "content_preview": description,
                                "published_at": pub_date.isoformat(),
                                "feed_source": feed_url,
                            })
                except Exception as e:
                    print(f"Error fetching {feed_url}: {e}")
                    continue

            # 去重
            seen = set()
            unique_articles = []
            for a in all_articles:
                if a["source_url"] not in seen:
                    seen.add(a["source_url"])
                    unique_articles.append(a)

            print(json.dumps(unique_articles[:5], ensure_ascii=False))
          code_language: python3
          desc: 并行抓取多个 RSS 健康源
          outputs:
            articles_json:
              children: null
              type: string
          selected: false
          title: RSS 采集
          type: code
          variables:
            - value_selector: []
              variable: articles_json
        height: 54
        id: rss-fetch
        position:
          x: 384
          y: 282
        positionAbsolute:
          x: 384
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ── Node 3: 内容审核 (LLM) ──
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: DeepSeek 评估文章质量与匹配度
          model:
            completion_params:
              max_tokens: 500
              temperature: 0.3
            mode: chat
            name: deepseek-chat
            provider: deepseek
          prompt_template:
            - id: review-system
              role: system
              text: |
                You are the editorial gatekeeper for The Candid Care, a premium wellness publication.

                Evaluate the article below. Return ONLY a JSON object:

                {
                  "approved": true/false,
                  "quality_score": 1-5,
                  "category": "mindfulness|nutrition|movement|sleep|mental-health|relationships|self-care",
                  "reasoning": "brief explanation"
                }

                APPROVE: Evidence-based health, nutrition, fitness, sleep, mental health, mindfulness, self-care.
                REJECT: Celebrity gossip, politics, unsupported alternative medicine, product reviews without science, pure PR.
            - id: review-user
              role: user
              text: "Evaluate this article:\nTitle: {{#rss-fetch.articles_json#}}\n\nReturn JSON only."
          selected: false
          title: 内容审核
          type: llm
          variables: []
        height: 98
        id: article-review
        position:
          x: 688
          y: 282
        positionAbsolute:
          x: 688
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ── Node 4: 条件判断 ──
      - data:
          cases:
            - case_id: "true"
              conditions:
                - comparison_operator: contains
                  id: cond-approved
                  value: '"approved": true'
                  varType: string
                  variable_selector:
                    - article-review
                    - text
              id: "true"
              logical_operator: and
            - case_id: "false"
              conditions:
                - comparison_operator: contains
                  id: cond-rejected
                  value: '"approved": false'
                  varType: string
                  variable_selector:
                    - article-review
                    - text
              id: "false"
              logical_operator: and
          desc: 质量评分 ≥ 3 继续处理
          selected: false
          title: 是否通过审核?
          type: if-else
        height: 126
        id: if-approved
        position:
          x: 992
          y: 282
        positionAbsolute:
          x: 992
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ── Node 5: AI 改写 (LLM) ──
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: DeepSeek 重写为品牌风格
          model:
            completion_params:
              max_tokens: 3000
              temperature: 0.7
            mode: chat
            name: deepseek-chat
            provider: deepseek
          prompt_template:
            - id: rewrite-system
              role: system
              text: |
                You are a senior wellness editor at The Candid Care. Rewrite the article below in our brand voice.

                BRAND VOICE:
                - Warm but professional: Like a trusted friend who is also a medical professional
                - Empathetic and optimistic, but evidence-based
                - Conversational yet precise: plain language, accurate science

                STRUCTURE:
                1. Hook (1-2 paragraphs): Relatable scenario or surprising stat
                2. Why it matters (1-2 paragraphs): Context and urgency
                3. Core info (3-5 paragraphs): What the reader needs to know
                4. Actionable tips (2-3 paragraphs): What the reader can do today
                5. Bottom line (1 paragraph): Forward-looking summary

                FORMAT:
                - Use <h2> for main sections, <h3> for sub-sections
                - Include 1 <blockquote> pull-quote
                - Include 1 <ul> bulleted list
                - Paragraphs: 2-4 sentences
                - Total: 800-1200 words
                - Cite studies as: "A [year] study published in [Journal] found..."
                - NEVER: fear-mongering, miracle claims, clickbait

                Return ONLY the HTML body (no title, no <html> wrapper):
            - id: rewrite-user
              role: user
              text: |
                I need you to rewrite this article content for The Candid Care wellness publication.

                Original source info:
                {{#article-review.text#}}

                Please rewrite in our brand voice and return HTML body only.
          selected: false
          title: AI 改写
          type: llm
          variables: []
        height: 98
        id: article-rewrite
        position:
          x: 1296
          y: 182
        positionAbsolute:
          x: 1296
          y: 182
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ── Node 6: SEO 元数据 (LLM) ──
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: 生成标题/描述/FAQ/标签
          model:
            completion_params:
              max_tokens: 1500
              temperature: 0.4
            mode: chat
            name: deepseek-chat
            provider: deepseek
          prompt_template:
            - id: seo-system
              role: system
              text: |
                You are an SEO strategist. For the article below, generate metadata as a JSON object.
                Return ONLY valid JSON:
                {
                  "title": "SEO title (50-65 chars)",
                  "seoDescription": "Meta description (140-155 chars, include CTA)",
                  "excerpt": "Article excerpt for cards (150-180 chars)",
                  "tags": ["3-5", "keyword", "tags"],
                  "keyTakeaways": ["4 bullet points, each under 120 chars"],
                  "faqs": [
                    {"question": "Q1?", "answer": "A1."},
                    {"question": "Q2?", "answer": "A2."},
                    {"question": "Q3?", "answer": "A3."}
                  ],
                  "slug": "url-friendly-slug"
                }
                SEO rules:
                - Title: Include primary keyword, under 65 chars
                - Description: Action verb + value prop, under 155 chars
                - FAQs: Reflect "People Also Ask" patterns
                - Tags: lowercase, hyphenated
            - id: seo-user
              role: user
              text: "Rewrite this article for The Candid Care:\n\nCategories: {{#article-review.text#}}\n\nRewritten body: {{#article-rewrite.text#}}"
          selected: false
          title: SEO 元数据
          type: llm
          variables: []
        height: 98
        id: generate-metadata
        position:
          x: 1600
          y: 282
        positionAbsolute:
          x: 1600
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ── Node 7: Sanity 发布 (Code) ──
      - data:
          code: |
            """
            Sanity API — 生成文章并发布
            """
            import json
            import re
            import base64
            from datetime import datetime, timezone
            from urllib.request import Request, urlopen

            PROJECT_ID = "{{#env.SANITY_PROJECT_ID#}}"
            DATASET = "{{#env.SANITY_DATASET#}}" or "production"
            TOKEN = "{{#env.SANITY_API_TOKEN#}}"
            AUTHOR_REF = "{{#env.AUTHOR_REF_ID#}}"

            API_BASE = f"https://{PROJECT_ID}.api.sanity.io/v1"

            def api_post(url, body):
                data = json.dumps(body).encode("utf-8")
                headers = {
                    "Authorization": f"Bearer {TOKEN}",
                    "Content-Type": "application/json",
                }
                req = Request(url, data=data, headers=headers, method="POST")
                with urlopen(req) as resp:
                    return json.loads(resp.read().decode("utf-8"))

            # 解析 SEO 元数据
            metadata_str = """{{#generate-metadata.text#}}"""
            match = re.search(r'\{.*\}', metadata_str, re.DOTALL)
            metadata = json.loads(match.group()) if match else {}

            # 获取改写内容
            body_html = """{{#article-rewrite.text#}}"""

            # HTML → Portable Text 块
            blocks = []
            chunks = re.findall(
                r'<(h[23]|p|blockquote|ul)(?:\s[^>]*)?>(.*?)</\1>',
                body_html, re.DOTALL | re.IGNORECASE
            )

            for tag, content in chunks:
                clean = re.sub(r'<[^>]+>', '', content).strip()
                if not clean:
                    continue
                tag = tag.lower()
                if tag in ('h2', 'h3'):
                    blocks.append({
                        "_type": "block",
                        "style": f"h{2 if tag == 'h2' else 3}",
                        "children": [{"_type": "span", "text": clean}],
                    })
                elif tag == 'blockquote':
                    blocks.append({
                        "_type": "block",
                        "style": "blockquote",
                        "children": [{"_type": "span", "text": clean}],
                    })
                elif tag == 'ul':
                    items = re.findall(r'<li>(.*?)</li>', content, re.DOTALL)
                    blocks.append({
                        "_type": "block",
                        "style": "normal",
                        "listItem": "bullet",
                        "level": 1,
                        "children": [
                            {"_type": "span", "text": re.sub(r'<[^>]+>', '', i).strip()}
                            for i in items
                        ],
                    })
                elif tag == 'p':
                    blocks.append({
                        "_type": "block",
                        "style": "normal",
                        "children": [{"_type": "span", "text": clean}],
                    })

            # 如果没有解析出 block，使用纯文本
            if not blocks:
                text = re.sub(r'<[^>]+>', '', body_html).strip()
                paragraphs = [p.strip() for p in text.split('\n\n') if p.strip()]
                blocks = [
                    {"_type": "block", "style": "normal", "children": [{"_type": "span", "text": p[:500]}]}
                    for p in paragraphs[:20]
                ]

            # 查询分类 ref
            category_name = metadata.get("category", "mindfulness")
            query_url = f"{API_BASE}/data/query/{DATASET}"
            query = f'*[_type == "category" && slug.current == "{category_name}"][0]._id'
            with urlopen(Request(
                query_url + "?query=" + query,
                headers={"Authorization": f"Bearer {TOKEN}"}
            )) as resp:
                query_result = json.loads(resp.read().decode("utf-8"))
                category_ref = query_result.get("result", "")

            # 兜底：第一个分类
            if not category_ref:
                fb_query = '*[_type == "category"][0]._id'
                with urlopen(Request(
                    query_url + "?query=" + fb_query,
                    headers={"Authorization": f"Bearer {TOKEN}"}
                )) as resp:
                    fb_result = json.loads(resp.read().decode("utf-8"))
                    category_ref = fb_result.get("result", "")

            # 占位图 (SVG 暖色渐变)
            title = metadata.get("title", "The Candid Care")
            svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
              <defs>
                <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#1C1A17"/>
                  <stop offset="50%" style="stop-color:#A16207"/>
                  <stop offset="100%" style="stop-color:#FAFAF8"/>
                </linearGradient>
              </defs>
              <rect width="1200" height="630" fill="url(#bg)"/>
              <text x="600" y="315" text-anchor="middle" fill="white"
                    font-family="Georgia,serif" font-size="42" font-weight="bold"
                    opacity="0.9">{title}</text>
            </svg>'''

            # 上传图片
            upload_body = {
                "fileName": "hero-image.svg",
                "contentType": "image/svg+xml",
                "content": base64.b64encode(svg.encode("utf-8")).decode("utf-8"),
            }
            upload_result = api_post(f"{API_BASE}/assets/images/{DATASET}", upload_body)
            image_asset_id = upload_result.get("document", {}).get("_id", "")

            # 创建文章
            slug = metadata.get("slug", re.sub(r'[^a-z0-9]+', '-', title.lower()).strip('-')[:80])
            mutation = {
                "mutations": [{
                    "create": {
                        "_type": "article",
                        "title": title,
                        "slug": {"_type": "slug", "current": slug},
                        "author": {"_type": "reference", "_ref": AUTHOR_REF},
                        "category": {"_type": "reference", "_ref": category_ref},
                        "heroImage": {
                            "_type": "image",
                            "asset": {"_type": "reference", "_ref": image_asset_id},
                            "alt": title,
                        },
                        "excerpt": metadata.get("excerpt", "")[:200],
                        "body": blocks,
                        "publishedAt": datetime.now(timezone.utc).isoformat(),
                        "seoTitle": metadata.get("title", title)[:70],
                        "seoDescription": metadata.get("seoDescription", "")[:160],
                        "tags": metadata.get("tags", []),
                        "keyTakeaways": metadata.get("keyTakeaways", []),
                        "faqs": [
                            {"question": f["question"], "answer": f["answer"]}
                            for f in metadata.get("faqs", [])
                        ],
                    }
                }]
            }

            result = api_post(f"{API_BASE}/data/mutate/{DATASET}", mutation)

            print(json.dumps({
                "success": True,
                "article_slug": slug,
                "transaction_id": result.get("transactionId", ""),
                "message": "Published to Sanity successfully",
            }, ensure_ascii=False))
          code_language: python3
          desc: 上传占位图并创建 Sanity 文章
          outputs:
            publish_result:
              children: null
              type: string
          selected: false
          title: Sanity 发布
          type: code
          variables:
            - value_selector: []
              variable: publish_result
        height: 54
        id: sanity-publish
        position:
          x: 1904
          y: 282
        positionAbsolute:
          x: 1904
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ── Node 8: End ──
      - data:
          answer: |
            ✅ 文章发布完成！

            {{#sanity-publish.publish_result#}}
          desc: 文章已发布，Webhook 将触发 Vercel 重建
          selected: false
          title: 完成
          type: answer
          variables: []
        height: 100
        id: end
        position:
          x: 2208
          y: 282
        positionAbsolute:
          x: 2208
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

    viewport:
      x: 0
      y: 0
      zoom: 1
