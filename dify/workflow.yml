      # ===== NODE 2: RSS Fetch (Code) =====
      - data:
          code: |
            import feedparser
            import json
            import os
            import hashlib
            from datetime import datetime, timedelta
            import ssl

            # 忽略 SSL 证书验证 (部分 RSS 源证书问题)
            if hasattr(ssl, '_create_unverified_context'):
                ssl._create_default_https_context = ssl._create_unverified_context

            def main() -> dict:
                """
                从环境变量 RSS_FEED_URLS 读取多个 RSS 源，
                抓取最近 24 小时内的文章，去重后返回。
                """
                feed_urls_raw = os.environ.get("RSS_FEED_URLS", "")
                if not feed_urls_raw.strip():
                    return {"articles_json": "[]", "article_count": 0, "error": "RSS_FEED_URLS is empty"}

                feed_urls = [url.strip() for url in feed_urls_raw.strip().split("\n") if url.strip()]

                cutoff_time = datetime.utcnow() - timedelta(hours=24)
                all_articles = []
                seen_urls = set()

                for url in feed_urls:
                    try:
                        feed = feedparser.parse(url)
                        source_title = feed.feed.get("title", "Unknown Source")

                        for entry in feed.entries:
                            entry_url = entry.get("link", "")
                            if not entry_url or entry_url in seen_urls:
                                continue

                            # 检查发布时间
                            published = None
                            if hasattr(entry, "published_parsed") and entry.published_parsed:
                                published = datetime(*entry.published_parsed[:6])
                            elif hasattr(entry, "updated_parsed") and entry.updated_parsed:
                                published = datetime(*entry.updated_parsed[:6])

                            if published and published < cutoff_time:
                                continue

                            seen_urls.add(entry_url)
                            all_articles.append({
                                "title": entry.get("title", ""),
                                "url": entry_url,
                                "source": source_title,
                                "summary": entry.get("summary", ""),
                                "published": published.isoformat() if published else ""
                            })
                    except Exception as e:
                        print(f"Error fetching {url}: {e}")
                        continue

                return {
                    "articles_json": json.dumps(all_articles, ensure_ascii=False),
                    "article_count": len(all_articles),
                    "error": ""
                }
          code_language: python3
          outputs:
            articles_json:
              children: null
              type: string
            article_count:
              children: null
              type: number
            error:
              children: null
              type: string
          selected: false
          title: "RSS 采集"
          type: code
          variables: []
        height: 52
        id: "1769000000002"
        position:
          x: 382
          y: 300
        positionAbsolute:
          x: 382
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 242

      # ===== NODE 3: Article Rewrite (LLM) =====
      - data:
          context:
            enabled: false
            variable_selector: []
          model:
            completion_params:
              temperature: 0.7
            mode: chat
            name: deepseek-chat
            provider: langgenius/deepseek/deepseek
          prompt_template:
            - id: a1b2c3d4-1111-1111-1111-111111111111
              role: system
              text: |
                You are The Candid Care's senior wellness editor. Your job is to rewrite one health/wellness article from an RSS feed into the brand voice.

                ## Brand Voice & Style Guide
                - **Tone**: Warm, compassionate, evidence-based, never preachy
                - **Structure**: 5-section format:
                  1. Hook (1 paragraph — relatable opening that connects emotionally)
                  2. The Science (2-3 paragraphs — evidence, studies, expert context)
                  3. The Practice (2-3 paragraphs — actionable, practical guidance)
                  4. Common Pitfalls (1-2 paragraphs — what to watch out for)
                  5. Closing Reflection (1 paragraph — gentle, inspiring wrap-up)
                - **Length**: 800-1200 words total
                - **Language**: Clean, accessible English; avoid jargon; Flesch-Kincaid grade 8-10
                - **Point of View**: Second person ("you") for connection, first person plural ("we") sparingly
                - **Quotes**: If the original article has expert quotes, keep them and attribute properly

                ## Output Format
                Return a structured JSON object:
                ```json
                {
                  "title": "SEO-optimized title (50-70 chars)",
                  "category": "one of: mindfulness, nutrition, movement, sleep, mental-health, relationships, self-care",
                  "excerpt": "Compelling excerpt (120-160 chars)",
                  "body_html": "<h2>Hook</h2><p>...</p><h2>The Science</h2>...",
                  "tags": ["tag1", "tag2", "tag3"],
                  "source_url": "original article URL",
                  "source_name": "original source name"
                }
                ```

                Only output valid JSON — no markdown code fences, no extra commentary.
            - id: a1b2c3d4-2222-2222-2222-222222222222
              role: user
              text: |
                Here are the RSS articles to process. Choose only the best ONE (highest relevance to wellness, most actionable, most inspiring):

                {{#1769000000002.articles_json#}}

                If none of the articles are suitable for The Candid Care, return:
                {"skip": true, "reason": "No suitable articles found"}
