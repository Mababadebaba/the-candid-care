      # ===== NODE 5: Sanity Publish (Code) =====
      - data:
          code: |
            import json
            import os
            import re
            import html
            from urllib.request import Request, urlopen
            from urllib.error import URLError
            import ssl

            ssl._create_default_https_context = ssl._create_unverified_context

            def html_to_portable_text(html_str: str) -> list:
                """Convert basic HTML to Sanity Portable Text blocks."""
                blocks = []
                # Remove HTML comments
                html_str = re.sub(r'<!--.*?-->', '', html_str, flags=re.DOTALL)
                # Split by block-level tags
                parts = re.split(r'(<(?:h[1-3]|p|ul|ol|blockquote)[^>]*>.*?</(?:h[1-3]|p|ul|ol|blockquote)>)', html_str, flags=re.DOTALL)

                for part in parts:
                    part = part.strip()
                    if not part:
                        continue

                    # Heading
                    h_match = re.match(r'<h([1-3])[^>]*>(.*?)</h\1>', part, re.DOTALL)
                    if h_match:
                        level = int(h_match.group(1))
                        # Get plain text from heading (strip inner HTML)
                        inner = re.sub(r'<[^>]+>', '', h_match.group(2)).strip()
                        style = ['h2', 'h3', 'h3'][level - 1] if level <= 3 else 'h3'
                        blocks.append({
                            "_type": "block",
                            "style": style,
                            "children": [{"_type": "span", "text": inner}]
                        })
                        continue

                    # Paragraph
                    p_match = re.match(r'<p[^>]*>(.*?)</p>', part, re.DOTALL)
                    if p_match:
                        inner = p_match.group(1).strip()
                        children = parse_inline(inner)
                        blocks.append({
                            "_type": "block",
                            "style": "normal",
                            "children": children if children else [{"_type": "span", "text": inner}]
                        })
                        continue

                    # Blockquote
                    bq_match = re.match(r'<blockquote[^>]*>(.*?)</blockquote>', part, re.DOTALL)
                    if bq_match:
                        inner = re.sub(r'<[^>]+>', '', bq_match.group(1)).strip()
                        blocks.append({
                            "_type": "block",
                            "style": "blockquote",
                            "children": [{"_type": "span", "text": inner}]
                        })
                        continue

                    # Unordered list
                    ul_match = re.match(r'<ul[^>]*>(.*?)</ul>', part, re.DOTALL)
                    if ul_match:
                        items = re.findall(r'<li[^>]*>(.*?)</li>', ul_match.group(1), re.DOTALL)
                        for item in items:
                            inner = re.sub(r'<[^>]+>', '', item).strip()
                            blocks.append({
                                "_type": "block",
                                "style": "normal",
                                "listItem": "bullet",
                                "level": 1,
                                "children": [{"_type": "span", "text": inner}]
                            })
                        continue

                return blocks

            def parse_inline(text: str) -> list:
                """Parse inline formatting (bold, italic, links)."""
                children = []
                # Simple approach: split by <strong>, <em>, <a>
                pattern = r'(<strong>(.*?)</strong>|<em>(.*?)</em>|<a\s+href="(.*?)">(.*?)</a>)'
                last_end = 0
                for m in re.finditer(pattern, text):
                    # Text before match
                    before = text[last_end:m.start()].strip()
                    if before:
                        children.append({"_type": "span", "text": before})
                    if m.group(2):  # <strong>
                        children.append({"_type": "span", "text": m.group(2).strip(), "marks": ["strong"]})
                    elif m.group(3):  # <em>
                        children.append({"_type": "span", "text": m.group(3).strip(), "marks": ["em"]})
                    elif m.group(5):  # <a>
                        children.append({
                            "_type": "span",
                            "text": m.group(5).strip(),
                            "marks": ["link"],
                            "markDefs": [{"_type": "link", "href": m.group(4)}]
                        })
                    last_end = m.end()
                # Remaining text
                remaining = text[last_end:].strip()
                if remaining:
                    children.append({"_type": "span", "text": remaining})
                return children

            def upload_image_and_get_ref(project_id: str, dataset: str, token: str, image_label: str) -> str:
                """Upload a placeholder SVG image to Sanity and return image asset ref."""
                svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
                  <defs>
                    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" style="stop-color:#1C1A17"/>
                      <stop offset="50%" style="stop-color:#A16207"/>
                      <stop offset="100%" style="stop-color:#FAFAF8"/>
                    </linearGradient>
                  </defs>
                  <rect width="1200" height="630" fill="url(#bg)"/>
                  <text x="600" y="315" text-anchor="middle" fill="#FFFFFF" font-family="Georgia,serif" font-size="48" font-weight="bold">{html.escape(image_label[:60])}</text>
                </svg>'''

                try:
                    # Upload image file
                    upload_url = f"https://{project_id}.api.sanity.io/v2023-08-01/assets/images/{dataset}"
                    req = Request(upload_url, data=svg.encode('utf-8'), method='POST')
                    req.add_header('Authorization', f'Bearer {token}')
                    req.add_header('Content-Type', 'image/svg+xml')
                    req.add_header('Accept', 'application/json')

                    with urlopen(req, timeout=30) as resp:
                        result = json.loads(resp.read().decode('utf-8'))
                        return result.get('document', {}).get('_id', 'image-placeholder')
                except Exception as e:
                    print(f"Image upload failed: {e}")
                    return 'image-placeholder'

            def main(rewritten_text: str, seo_text: str) -> dict:
                """
                Parse the rewritten article + SEO metadata, create Sanity document.
                """
                project_id = os.environ.get("SANITY_PROJECT_ID", "o06jwzs8")
                dataset = os.environ.get("SANITY_DATASET", "production")
                token = os.environ.get("SANITY_API_TOKEN", "")
                author_ref = os.environ.get("AUTHOR_REF_ID", "author-default")
                site_url = os.environ.get("SITE_PUBLIC_URL", "https://the-candid-care.vercel.app")

                if not token:
                    return {"status": "error", "message": "SANITY_API_TOKEN is not set"}

                # Parse rewritten article JSON
                try:
                    article = json.loads(rewritten_text)
                except json.JSONDecodeError:
                    # Try to extract JSON from text
                    json_match = re.search(r'\{.*\}', rewritten_text, re.DOTALL)
                    if json_match:
                        article = json.loads(json_match.group(0))
                    else:
                        return {"status": "error", "message": "Failed to parse rewritten article JSON"}

                if article.get("skip"):
                    return {"status": "skipped", "reason": article.get("reason", "No suitable articles")}

                # Parse SEO metadata JSON
                try:
                    seo = json.loads(seo_text)
                except json.JSONDecodeError:
                    json_match = re.search(r'\{.*\}', seo_text, re.DOTALL)
                    if json_match:
                        seo = json.loads(json_match.group(0))
                    else:
                        seo = {}

                if seo.get("skip"):
                    return {"status": "skipped", "reason": "SEO step determined article should be skipped"}

                # Extract article data
                title = article.get("title", "Untitled")
                category_slug = article.get("category", "mindfulness")
                excerpt = article.get("excerpt", "")
                body_html = article.get("body_html", "")
                tags = article.get("tags", [])
                source_url = article.get("source_url", "")
                source_name = article.get("source_name", "")

                # SEO data
                seo_title = seo.get("seo_title", title)
                meta_description = seo.get("meta_description", excerpt)
                faqs = seo.get("faqs", [])
                key_takeaways = seo.get("key_takeaways", [])
                reading_time = seo.get("reading_time_minutes", 5)
                focus_keyword = seo.get("focus_keyword", "")

                # Convert HTML to Portable Text
                body_blocks = html_to_portable_text(body_html)

                # Upload placeholder image
                image_ref = upload_image_and_get_ref(project_id, dataset, token, title)

                # Build Sanity document
                import time
                slug_current = re.sub(r'[^a-z0-9]+', '-', title.lower()).strip('-')[:96]

                doc = {
                    "_type": "article",
                    "title": title,
                    "slug": {"_type": "slug", "current": slug_current},
                    "heroImage": {
                        "_type": "image",
                        "asset": {"_type": "reference", "_ref": image_ref}
                    },
                    "excerpt": excerpt,
                    "body": body_blocks,
                    "author": {"_type": "reference", "_ref": author_ref},
                    "category": {"_type": "reference", "_ref": f"cat-{category_slug}"},
                    "tags": tags,
                    "readingTime": reading_time,
                    "seoTitle": seo_title,
                    "seoDescription": meta_description,
                    "focusKeyword": focus_keyword,
                    "faqs": [{"_key": f"faq{i}", "question": q.get("question", ""), "answer": q.get("answer", "")} for i, q in enumerate(faqs)],
                    "keyTakeaways": key_takeaways,
                    "sourceUrl": source_url,
                    "sourceName": source_name,
                    "publishedAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                }

                # Create document in Sanity
                create_url = f"https://{project_id}.api.sanity.io/v2023-08-01/data/mutate/{dataset}"
                payload = json.dumps({"mutations": [{"create": doc}]}).encode('utf-8')

                req = Request(create_url, data=payload, method='POST')
                req.add_header('Authorization', f'Bearer {token}')
                req.add_header('Content-Type', 'application/json')
                req.add_header('Accept', 'application/json')

                try:
                    with urlopen(req, timeout=30) as resp:
                        result = json.loads(resp.read().decode('utf-8'))
                        return {
                            "status": "published",
                            "title": title,
                            "category": category_slug,
                            "slug": slug_current,
                            "url": f"{site_url}/{category_slug}/{slug_current}"
                        }
                except URLError as e:
                    return {"status": "error", "message": f"Sanity API error: {str(e)}"}
          code_language: python3
          outputs:
            status:
              children: null
              type: string
            title:
