        title: "5. 发布到 Sanity"
        type: code
        code_language: python3
        code: |
          import urllib.request
          import json
          import re
          import os
          import ssl
          from datetime import datetime, timezone

          def main(rewrite_text: str, seo_text: str, article_title: str, article_link: str) -> dict:
              """将改写后的文章发布到 Sanity CMS"""
              proj_id = os.environ.get("SANITY_PROJECT_ID", "o06jwzs8")
              dataset = os.environ.get("SANITY_DATASET", "production")
              token = os.environ.get("SANITY_API_TOKEN", "")
              author_id = os.environ.get("AUTHOR_REF_ID", "author-default")
              site_url = os.environ.get("SITE_PUBLIC_URL", "https://the-candid-care.vercel.app")
              ssl_context = ssl.create_default_context()
              ssl_context.check_hostname = False
              ssl_context.verify_mode = ssl.CERT_NONE

              if not token:
                  return {"status": "error: SANITY_API_TOKEN not set", "title": "", "slug": "", "url": ""}

              # 从SEO输出中解析Title和Description
              seo_title = article_title
              seo_desc = ""
              seo_category = "cat-self-care"
              seo_keywords = ""
              for line in seo_text.strip().split("\n"):
                  line_lower = line.strip().lower()
                  if line_lower.startswith("title:"):
                      seo_title = line.split(":", 1)[1].strip()
                  elif line_lower.startswith("description:"):
                      seo_desc = line.split(":", 1)[1].strip()
                  elif line_lower.startswith("category:"):
                      cat_val = line.split(":", 1)[1].strip().lower().replace(" ", "-")
                      valid_cats = ["mental-health", "mindfulness", "movement", "nutrition", "relationships", "self-care", "sleep"]
                      for vc in valid_cats:
                          if vc in cat_val:
                              seo_category = f"cat-{vc}"
                              break
                  elif line_lower.startswith("key takeaway") or line_lower.startswith("keywords"):
                      pass

              # 生成 slug
              slug = re.sub(r'[^a-z0-9]+', '-', seo_title.lower().strip())[:60].strip('-')

              # 构建 Sanity mutation（注意: _type 必须是 "article"）
              doc = {
                  "_type": "article",
                  "_id": slug,
                  "title": seo_title,
                  "slug": {"_type": "slug", "current": slug},
                  "body": [{
                      "_type": "block",
                      "style": "normal",
                      "children": [{
                          "_type": "span",
                          "text": rewrite_text[:20000]
                      }]
                  }],
                  "excerpt": seo_desc[:200] if seo_desc else rewrite_text[:200],
                  "author": {"_type": "reference", "_ref": author_id},
                  "category": {"_type": "reference", "_ref": seo_category},
                  "publishedAt": datetime.now(timezone.utc).isoformat(),
                  "seoTitle": seo_title[:70],
                  "seoDescription": seo_desc[:160]
              }
              mutations = [{"createOrReplace": doc}]

              # 发送到 Sanity API
              url = f"https://{proj_id}.api.sanity.io/v2024-01-01/data/mutate/{dataset}"
              body = json.dumps({"mutations": mutations}).encode('utf-8')

              req = urllib.request.Request(url, data=body, method='POST')
              req.add_header('Authorization', f'Bearer {token}')
              req.add_header('Content-Type', 'application/json')

              try:
                  with urllib.request.urlopen(req, timeout=30, context=ssl_context) as resp:
                      result = json.loads(resp.read())

                  if 'transactionId' in result:
                      return {
                          "status": "success",
                          "title": seo_title,
                          "slug": slug,
                          "url": f"{site_url}/posts/{slug}"
                      }
                  else:
                      return {
                          "status": f"error: {json.dumps(result)[:200]}",
                          "title": seo_title,
                          "slug": slug,
                          "url": ""
                      }
              except Exception as e:
                  return {
                      "status": f"error: {str(e)[:200]}",
                      "title": seo_title,
                      "slug": slug,
                      "url": ""
                  }
        outputs:
          status:
            type: string
            children: null
          title:
            type: string
            children: null
          slug:
            type: string
            children: null
          url:
            type: string
            children: null
