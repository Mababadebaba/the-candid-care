        title: "2. 抓取 RSS"
        type: code
        code_language: python3
        code: |
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import re
          import ssl

          def main() -> dict:
              """抓取健康资讯 RSS feed，提取最新3篇文章"""
              rss_url = "https://rss.nytimes.com/services/xml/rss/nyt/Well.xml"
              ssl_context = ssl.create_default_context()
              ssl_context.check_hostname = False
              ssl_context.verify_mode = ssl.CERT_NONE

              req = urllib.request.Request(rss_url, headers={
                  'User-Agent': 'TheCandidCare/1.0',
                  'Accept': 'application/rss+xml,application/xml'
              })

              with urllib.request.urlopen(req, timeout=30, context=ssl_context) as resp:
                  xml_data = resp.read().decode('utf-8')

              root = ET.fromstring(xml_data)

              # 先尝试 RSS <item>，再尝试 Atom <entry>
              items = root.findall('.//item')
              if not items:
                  ns = {'atom': 'http://www.w3.org/2005/Atom'}
                  items = root.findall('.//atom:entry', ns)

              articles = []
              for item in items[:3]:
                  title_el = item.find('title')
                  link_el = item.find('link')
                  desc_el = item.find('description')

                  title = title_el.text.strip() if title_el is not None and title_el.text else ''
                  link = ''
                  if link_el is not None:
                      link = link_el.text.strip() if link_el.text else link_el.get('href', '')
                  summary = desc_el.text.strip() if desc_el is not None and desc_el.text else ''

                  if title:
                      articles.append({
                          'title': title,
                          'link': link,
                          'summary': summary[:500]
                      })

              return {
                  'articles': articles,
                  'count': len(articles),
                  'json': json.dumps(articles, ensure_ascii=False)
              }
        outputs:
          articles:
            type: array[object]
            children: null
          count:
            type: number
            children: null
          json:
            type: string
            children: null
